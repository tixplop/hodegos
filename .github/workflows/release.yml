# Construit et publie une release Linux x86_64 (WSL2) à chaque tag vX.Y.Z.
# Notes : docs/releases/<tag>.md s'il existe, sinon notes générées par GitHub.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à (re)construire, par exemple v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    # Ubuntu 24.04 : glibc 2.39, minimum exigé du binaire (annoncé dans les notes).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Vérifier que le tag correspond à la version du workspace
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hodegos-cli") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG, version du workspace $version"
            exit 1
          fi

      - name: Formatage
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Construire
        run: cargo build --release --locked --target "$TARGET" -p hodegos-cli

      - name: Empaqueter
        run: |
          name="hodegos-$TAG-$TARGET"
          mkdir -p "dist/$name/licences-tierces"
          cp "target/$TARGET/release/hodegos" "dist/$name/"
          strip "dist/$name/hodegos"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp ui/vendor/LICENSES.md "dist/$name/licences-tierces/codemirror.md"
          cp ui/fonts/LICENSE-*.txt "dist/$name/licences-tierces/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$ARCHIVE" "$ARCHIVE.sha256"
          else
            notes="docs/releases/$TAG.md"
            if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
            gh release create "$TAG" --verify-tag \
              --title "Hodegos $TAG (Linux x86_64, WSL2)" "$@" \
              "$ARCHIVE" "$ARCHIVE.sha256"
          fi
