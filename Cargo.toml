[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
hodegos-core = { path = "crates/hodegos-core" }
hodegos-mentors = { path = "crates/hodegos-mentors" }
hodegos-llm = { path = "crates/hodegos-llm" }
hodegos-server = { path = "crates/hodegos-server" }

anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
deunicode = "1.6.2"
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
globset = "0.4.21"
http-body-util = "0.1.5"
ignore = "0.4.34"
jiff = "0.2.38"
notify-debouncer-full = "0.7.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust-embed = { version = "8.13.0", features = ["mime-guess", "include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "signal"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tree-sitter = "0.27.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ulid = "3.0.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
