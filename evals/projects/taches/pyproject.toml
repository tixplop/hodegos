[project]
name = "taches"
version = "0.3.0"
description = "Tâches ménagères en ligne de commande"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
taches = "taches.cli:principal"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
